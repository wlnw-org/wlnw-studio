[package]
name = "wlnw-batdetect2"
description = "BatDetect2's spectrogram, network run and call decoding, translated to Rust for Wildlife Network Studio"
version.workspace = true
edition.workspace = true
# A direct translation of BatDetect2 (github.com/macaodha/batdetect2), so it keeps BatDetect2's licence, not the
# Apache-2.0 of the rest of Studio. See LICENSE and NOTICE in this folder.
license = "CC-BY-NC-4.0"

[dependencies]
anyhow = "1.0.104"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"] }
rayon = "1.12.0"
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
