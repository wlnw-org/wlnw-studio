[package]
name = "wlnw-engine"
description = "Wildlife Network Studio engine: audio, BirdNET, project store, review, export, publish"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wlnw"
path = "src/bin/wlnw.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs4 = "1.1.0"
half = "2.7.1"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.2"
mozjpeg = { version = "0.10.13", default-features = false }
mozjpeg-sys = { version = "2.2", default-features = false, features = ["unwinding"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"] }
rayon = "1.12.0"
realfft = "3.5.1"
regex = "1.13.1"
rubato = "0.16"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.5", features = ["wav", "flac", "pcm", "mp3"] }
thiserror = "2.0.21"
ureq = { version = "2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
