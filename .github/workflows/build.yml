# Desktop builds. Run by hand (Actions tab, "Build" > Run workflow) or by pushing a v* tag, not on every push:
# Windows minutes count double on private repositories.
name: Build

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build for macOS (Apple Silicon and Intel)"
        type: boolean
        default: false
      linux:
        description: "Also build for Linux (x64 AppImage and deb)"
        type: boolean
        default: true
      test_signing:
        description: "Sign the Windows installer with a throwaway test certificate (checks the signing step; not for release)"
        type: boolean
        default: false
      esigner_sandbox:
        description: "Sign with SSL.com eSigner's public sandbox (checks the eSigner step; not for release)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job may write (it creates the GitHub Release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows always; Linux and macOS on tags or when asked for.
        target: ${{ fromJSON(format('["windows-x64"{0}{1}]', (startsWith(github.ref, 'refs/tags/v') || inputs.linux) && ', "linux-x64"' || '', (startsWith(github.ref, 'refs/tags/v') || inputs.macos) && ', "macos-arm64", "macos-x64"' || '')) }}
    name: ${{ matrix.target }}
    # macos-x64 runs on an Intel runner, so the ONNX Runtime library and the compiler runtime match the target natively.
    # linux-x64: ort's prebuilt ONNX Runtime needs glibc 2.38+ (__isoc23_strtol), so Ubuntu 24.04; the AppImage and deb
    # therefore need glibc 2.39 or newer (Ubuntu 24.04, Debian 13, Fedora 40 and later).
    runs-on: ${{ matrix.target == 'windows-x64' && 'windows-latest' || matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'macos-x64' && 'macos-15-intel' || 'macos-latest' }}
    timeout-minutes: ${{ matrix.target == 'macos-x64' && 240 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: System libraries (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential file libfuse2t64

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}

      # ONNX Runtime publishes no Intel Mac library any more (neither Microsoft nor ort's prebuilt set), so it is built from
      # source once and cached: static libraries only, linked into the app by ort-sys through ORT_LIB_PATH.
      - name: ONNX Runtime cache (Intel Mac)
        if: matrix.target == 'macos-x64'
        id: ort
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ort-x64
          key: onnxruntime-1.31.1-osx-x86_64-static-v3

      - name: Build ONNX Runtime (Intel Mac)
        if: matrix.target == 'macos-x64' && steps.ort.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.31.1 --recursive https://github.com/microsoft/onnxruntime.git "$RUNNER_TEMP/onnxruntime"
          cd "$RUNNER_TEMP/onnxruntime"
          ./build.sh --config Release --parallel --skip_tests --compile_no_warning_as_error --skip_submodule_sync --build_shared_lib \
            --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64 CMAKE_OSX_DEPLOYMENT_TARGET=11.0 onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_USE_TELEMETRY=OFF
          # Telemetry off: build.sh turns Microsoft's 1DS telemetry client on by default, and Studio sends no telemetry.
          # --build_shared_lib makes CMake build every dependency (re2, abseil, protobuf...), which a static-only build skips.
          # Keep only the static libraries, in the layout ort-sys expects (<dir>/Release/*.a and <dir>/Release/_deps/...).
          cd build/MacOS
          find Release -name '*.a' | while read -r f; do mkdir -p "$RUNNER_TEMP/ort-x64/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/ort-x64/$f"; done
          du -sh "$RUNNER_TEMP/ort-x64"

      # Saved straight away, so a later failing step does not throw away an hour of compiling.
      - name: Save ONNX Runtime build (Intel Mac)
        if: matrix.target == 'macos-x64' && steps.ort.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ort-x64
          key: onnxruntime-1.31.1-osx-x86_64-static-v3

      - name: Use the ONNX Runtime build (Intel Mac)
        if: matrix.target == 'macos-x64'
        run: echo "ORT_LIB_PATH=$RUNNER_TEMP/ort-x64/Release" >> "$GITHUB_ENV"  # Release/*.a with deps in Release/_deps/<lib>-build

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Engine tests
        run: cargo test --release -p wlnw-engine

      # Windows signing: Tauri calls app/scripts/sign-windows.mjs for the app and each installer. The certificate comes from
      # secrets (WINDOWS_PFX_BASE64 + WINDOWS_PFX_PASSWORD, or the ESIGNER_* set); without one the build stays unsigned.
      - name: Signing setup (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          TEST_SIGNING: ${{ inputs.test_signing }}
          HAS_PFX: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
          HAS_ESIGNER: ${{ secrets.ESIGNER_USERNAME != '' }}
          SANDBOX: ${{ inputs.esigner_sandbox }}
        run: |
          $script = (Join-Path $env:GITHUB_WORKSPACE "app/scripts/sign-windows.mjs").Replace('\', '/')
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = "node"; args = @($script, "%1") } } } } | ConvertTo-Json -Depth 6 | Set-Content app/src-tauri/tauri.sign.json
          if ($env:TEST_SIGNING -eq "true") {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Wildlife Network Studio TEST" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
            $pw = [guid]::NewGuid().ToString()
            Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("test.pfx"))
            Write-Output "::add-mask::$pw"
            "WINDOWS_PFX_BASE64=$b64" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_PFX_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
            Remove-Item test.pfx
            Write-Output "Test certificate created: the installer will be signed by 'Wildlife Network Studio TEST' (not trusted, for checking only)."
          } elseif ($env:HAS_ESIGNER -eq "true" -or $env:SANDBOX -eq "true") {
            # SSL.com CodeSignTool (Windows package, Java included): https://www.ssl.com/guide/esigner-codesigntool-command-guide/
            $dir = Join-Path $env:RUNNER_TEMP "CodeSignTool"
            Invoke-WebRequest -Uri "https://ssl.com/download/codesigntool-for-windows/" -OutFile "$env:RUNNER_TEMP\cst.zip"
            Expand-Archive "$env:RUNNER_TEMP\cst.zip" -DestinationPath $dir -Force
            $bat = Get-ChildItem -Path $dir -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
            if (-not $bat) { throw "CodeSignTool.bat not found in the download" }
            "CODESIGNTOOL_DIR=$($bat.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
            if ($env:SANDBOX -eq "true") {
              # SSL.com's published demo account and test endpoints: https://www.ssl.com/guide/esigner-demo-credentials-and-certificates/
              @"
          CLIENT_ID=qOUeZCCzSqgA93acB3LYq6lBNjgZdiOxQc-KayC3UMw
          OAUTH2_ENDPOINT=https://oauth-sandbox.ssl.com/oauth2/token
          CSC_API_ENDPOINT=https://cs-try.ssl.com
          TSA_URL=http://ts.ssl.com
          "@ -replace '(?m)^\s+', '' | Set-Content (Join-Path $bat.DirectoryName "conf/code_sign_tool.properties")
              "ESIGNER_USERNAME=esigner_demo" | Out-File -FilePath $env:GITHUB_ENV -Append
              "ESIGNER_PASSWORD=esignerDemo#1" | Out-File -FilePath $env:GITHUB_ENV -Append
              "ESIGNER_TOTP_SECRET=RDXYgV9qju+6/7GnMf1vCbKexXVJmUVr+86Wq/8aIGg=" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Output "eSigner sandbox: files will be signed with SSL.com's demo certificate (not trusted, for checking only)."
            } else { Write-Output "Signing with SSL.com eSigner." }
          } elseif ($env:HAS_PFX -eq "true") { Write-Output "Signing with the certificate in WINDOWS_PFX_BASE64." }
          else { Write-Output "No certificate secret set: the installer will be unsigned." }

      # macOS: Tauri signs with the Developer ID certificate (APPLE_CERTIFICATE, a base64 .p12) and notarizes with the
      # App Store Connect API key; without these secrets the app is built unsigned.
      - name: Notarization key (macOS)
        if: startsWith(matrix.target, 'macos')
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$P8" ]; then
            printf '%s' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          else echo "No notarization key set: the app will not be notarized."; fi

      - name: Build installer
        working-directory: app
        env:
          WINDOWS_PFX_BASE64: ${{ env.WINDOWS_PFX_BASE64 || secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ env.WINDOWS_PFX_PASSWORD || secrets.WINDOWS_PFX_PASSWORD }}
          ESIGNER_USERNAME: ${{ env.ESIGNER_USERNAME || secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ env.ESIGNER_PASSWORD || secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ env.ESIGNER_TOTP_SECRET || secrets.ESIGNER_TOTP_SECRET }}
          APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Updater signature (minisign), separate from code signing: every installer gets a .sig that the app checks.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            pnpm tauri build --bundles nsis,msi --config src-tauri/tauri.sign.json
          elif [ "${{ matrix.target }}" = "linux-x64" ]; then
            pnpm tauri build --bundles appimage,deb
          else
            # hdiutil on hosted Macs sometimes finds the disk image busy; a second try reuses the compiled app.
            for i in 1 2 3; do pnpm tauri build --bundles app,dmg && break; [ "$i" = 3 ] && exit 1; echo "::warning::bundling failed, retrying"; rm -rf ../target/release/bundle/dmg; sleep 15; done
          fi

      - name: Check signatures (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            $who = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { "unsigned" }
            Write-Output ("{0}: {1} ({2})" -f $f.Name, $who, $s.Status)
            if (("${{ inputs.test_signing }}" -eq "true" -or "${{ inputs.esigner_sandbox }}" -eq "true") -and -not $s.SignerCertificate) { throw "$($f.Name) was not signed" }
          }

      # Tauri notarizes the app inside; the disk image people download is notarized and stapled here too.
      - name: Notarize the disk image (macOS)
        if: startsWith(matrix.target, 'macos') && env.APPLE_API_KEY_PATH != ''
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for d in target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$d" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            # Stapling fetches the ticket from Apple; retry, as the connection sometimes drops.
            for i in 1 2 3 4 5; do xcrun stapler staple "$d" && break; [ "$i" = 5 ] && exit 1; sleep 20; done
          done

      - name: Check signature and notarization (macOS)
        if: startsWith(matrix.target, 'macos')
        run: |
          APP=$(ls -d target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority=Developer ID|TeamIdentifier|Runtime" || true
          spctl --assess --type execute --verbose=4 "$APP"
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; sleep 20; done; return 1; }
          # The disk image people download carries its own stapled ticket (checked below); the app inside is notarized
          # (spctl above) and Gatekeeper looks its ticket up online if Tauri could not staple it.
          retry xcrun stapler validate "$APP" || echo "::warning::No ticket stapled to the app itself; the disk image has one."
          for d in target/release/bundle/dmg/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose=4 "$d"
            retry xcrun stapler validate "$d"
          done

      # Updater files under fixed names (both Macs make the same "Wildlife Network Studio.app.tar.gz"), so the release
      # job can write latest.json. Windows and Linux update from the installer itself; only its signature is copied.
      - name: Updater files
        shell: bash
        run: |
          set -euo pipefail
          b=target/release/bundle; u=$b/updater; mkdir -p "$u"
          one() { local f; f=$(ls $1 | head -1); [ -n "$f" ] && [ -f "$f.sig" ] || { echo "::error::No updater signature for $1"; exit 1; }; echo "$f"; }
          case "${{ matrix.target }}" in
            macos-arm64|macos-x64)
              n=$([ "${{ matrix.target }}" = macos-arm64 ] && echo mac-arm64 || echo mac-intel)
              f=$(one "$b/macos/*.app.tar.gz"); cp "$f" "$u/Wildlife-Network-Studio-$n.app.tar.gz"; cp "$f.sig" "$u/Wildlife-Network-Studio-$n.app.tar.gz.sig" ;;
            windows-x64)
              f=$(one "$b/nsis/*-setup.exe"); cp "$f.sig" "$u/Wildlife-Network-Studio-windows-x64-setup.exe.sig"
              f=$(one "$b/msi/*.msi"); cp "$f.sig" "$u/Wildlife-Network-Studio-windows-x64.msi.sig" ;;
            linux-x64)
              f=$(one "$b/appimage/*.AppImage"); cp "$f.sig" "$u/Wildlife-Network-Studio-linux-x64.AppImage.sig"
              f=$(ls $b/deb/*.deb | head -1); if [ -f "$f.sig" ]; then cp "$f.sig" "$u/Wildlife-Network-Studio-linux-x64.deb.sig"; fi ;;
          esac
          ls -la "$u"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wildlife-network-studio-${{ matrix.target }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/updater/*
          if-no-files-found: error
          retention-days: 14

  # On a v* tag: a draft GitHub Release with the installers, for checking before it is published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          # Copies under fixed names, so https://github.com/<repo>/releases/latest/download/<name> always gets the newest version.
          mkdir stable
          cp dist/*/*_aarch64.dmg stable/Wildlife-Network-Studio-mac-arm64.dmg
          cp dist/*/*_x64.dmg stable/Wildlife-Network-Studio-mac-intel.dmg
          cp dist/*/*-setup.exe stable/Wildlife-Network-Studio-windows-x64-setup.exe
          cp dist/*/*.msi stable/Wildlife-Network-Studio-windows-x64.msi
          cp dist/*/*.AppImage stable/Wildlife-Network-Studio-linux-x64.AppImage
          cp dist/*/*.deb stable/Wildlife-Network-Studio-linux-x64.deb
          # latest.json for the in-app updater (endpoint: releases/latest/download/latest.json, so only published releases count).
          base="https://github.com/$REPO/releases/download/$TAG"
          u=dist/updater
          entry() { jq -n --arg url "$base/$1" --rawfile sig "$u/$1.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'; }
          notes="See https://github.com/$REPO/releases/tag/$TAG"
          [ -f "docs/releases/$TAG.md" ] && notes=$(cat "docs/releases/$TAG.md")
          platforms=$(jq -n \
            --argjson mac "$(entry Wildlife-Network-Studio-mac-arm64.app.tar.gz)" \
            --argjson intel "$(entry Wildlife-Network-Studio-mac-intel.app.tar.gz)" \
            --argjson nsis "$(entry Wildlife-Network-Studio-windows-x64-setup.exe)" \
            --argjson msi "$(entry Wildlife-Network-Studio-windows-x64.msi)" \
            --argjson appimage "$(entry Wildlife-Network-Studio-linux-x64.AppImage)" \
            '{"darwin-aarch64": $mac, "darwin-x86_64": $intel, "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis,
              "windows-x86_64-msi": $msi, "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage}')
          if [ -f "$u/Wildlife-Network-Studio-linux-x64.deb.sig" ]; then
            platforms=$(jq --argjson deb "$(entry Wildlife-Network-Studio-linux-x64.deb)" '. + {"linux-x86_64-deb": $deb}' <<< "$platforms")
          fi
          jq -n --arg v "${TAG#v}" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: $p}' > stable/latest.json
          jq '.platforms | keys' stable/latest.json
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; echo; fi
            echo "## Downloads"
            echo
            echo "- macOS: Apple Silicon (aarch64) and Intel (x64) builds, both signed with Developer ID and notarized."
            echo "- Windows (64-bit): the installers are not code signed yet, so Windows may show a SmartScreen warning (More info, then Run anyway)."
            echo "- Linux (x64): AppImage (make it executable, then run it) or deb for Debian and Ubuntu."
            echo
            echo "Studio checks for new versions on startup and offers to install them; updates are verified with a signature."
            echo
            echo "Models are downloaded inside the app on first use (Perch 2.0, about 410 MB)."
          } > notes.md
          gh release create "$TAG" dist/*/* stable/* --repo "$REPO" --draft \
            --title "Wildlife Network Studio $TAG" --notes-file notes.md
